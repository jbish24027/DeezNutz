; ---------- SITUATIONAL -----------------------------------------------------
; ORF_FromOtherGame  a crossover outfit (Zelda, Witcher, Elden Ring...)
; ORF_OutOfPlace     modern or non-Tamrielic looking
; ORF_Inappropriate  on an ARMOR: wrong for holy places.
;                    on a LOCATION: this place is a holy place.
;                    Location lines use |Location| not |Armor|.

;Keyword = ORF_FromOtherGame|Armor|
;Keyword = ORF_OutOfPlace|Armor|
;Keyword = ORF_Inappropriate|Armor|
;Keyword = ORF_Inappropriate|Location|

