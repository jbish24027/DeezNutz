; ==========================================================================
;  Outfit Recognition Framework - patch template
;  Copy this, rename it "ORF - <mod name>_ORF_KID.ini", drop it FLAT in the
;  root of a Mod Organizer mod folder. The "_KID" in the filename is what
;  makes KID read it. A subfolder makes it invisible with no error.
;
;  Line form:   Keyword = <ORF keyword>|Armor|<editorID>,<editorID>,...
;  Name match:  Keyword = <ORF keyword>|Armor|*Leather Armor
;  Whole mod:   Keyword = <ORF keyword>|Armor|SomeMod.esp
;  By formID:   Keyword = <ORF keyword>|Armor|0x000D66~SomeMod.esp
;
;  A misspelled ORF keyword does NOT error. KID quietly creates a new empty
;  keyword instead, and nothing in game hints at it. Check the log.
; ==========================================================================

; ---------- COLOUR (pick one per item; ORF_Colourful for multi-coloured) ----
; ORF_Red  ORF_Blue  ORF_Green  ORF_Black  ORF_White  ORF_Brown  ORF_Grey
; ORF_Gold ORF_Silver ORF_Yellow ORF_Pink  ORF_Purple ORF_Colourful

;Keyword = ORF_Red|Armor|
;Keyword = ORF_Blue|Armor|
;Keyword = ORF_Green|Armor|
;Keyword = ORF_Black|Armor|
;Keyword = ORF_White|Armor|
;Keyword = ORF_Brown|Armor|
;Keyword = ORF_Grey|Armor|
;Keyword = ORF_Gold|Armor|
;Keyword = ORF_Silver|Armor|
;Keyword = ORF_Yellow|Armor|
;Keyword = ORF_Pink|Armor|
;Keyword = ORF_Purple|Armor|
;Keyword = ORF_Colourful|Armor|

