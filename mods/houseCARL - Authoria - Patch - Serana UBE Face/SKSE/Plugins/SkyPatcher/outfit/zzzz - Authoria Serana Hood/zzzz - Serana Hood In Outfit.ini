; Authoria - give Serana the Obi Hood&Steel hood in her outfit.  2026-08-27
;
; WHY: SDA's CheckHood() only ever EQUIPS the hood - it never AddItem's one - and on
; take-off it does RemoveItem(Hoodie, 1), which DELETES it. So the hood has to be
; supplied by her outfit, exactly as vanilla did it. Without this she owns no hood,
; EquipItem no-ops, slot 31 stays empty, and SDA retries forever (tracker #241).
;
; 016903 = DLC1SeranaOutfit, her live Default Outfit, already filled by the UBE Serana
; replacer with its 8-piece Wine Duchess set. formsToAdd accumulates, so this does not
; fight that mod's own lines.
;
; The hood is 1_H&S_Hood from Obi's Hood and Steel Armor. It was chosen over the vanilla
; Serana hood because it already ships everything this needs:
;   - biped slots 31 (Hair) + 41 (LongHair), so SDA's GetEquippedArmorInSlot(31) guard
;     passes AND her hair headpart is hidden, which is what stops the hair clipping;
;   - a UBE armature (0_H&S_Hood_UBE) that lists 00UBE_NordRace, her actual race, so it
;     renders on her with no armature patch from us;
;   - Requiem keywords already on it (ArmorLight + REQ_ArmorSet_Leather + ArmorHelmet).
; SDA's Hoodie script property is repointed to match, in Authoria - Haberdashery.esp.
;
; REQUIRES the UBE hood mesh to be BUILT in BodySlide (group Obi_H&S_UBE, output
; Meshes\!UBE\Obicnii\HoodandSteel). Without that build the armature points at a mesh
; that does not exist and the hood is invisible.

filterByOutfits=Dawnguard.esm|16903:formsToAdd=Obi's Hood&Steel.esp|D63
