----------------------------------------------
[DUALENCH]
Same as blacklist, except that these perks won't be permanently excluded. They will be stored by the mod to be added or
removed from the blacklist whenever the 'Dual Enchantment' option is used in the MCM.

The reason for this option's existence is the tendency of certain mods to reduce the effectiveness of enchantments
once the 'Extra Enchantment' perk has been acquired. Allowing for two weaker enchantments or a single strong one.
If you have such a mod, you can add the relevant perk(s) here and you'll be able to toggle them at will in the MCM
before speaking to an enchanter.

In some mods, like Requiem and Perma, the 'extra-enchantment' perk itself doesn't have the expected effect in-game but
it grants an ability or spell that does. Both of these are already handled internally by HM.

|Requiem.esp|
------------
Already handled by the mod internally. No need to specify anything here.

|Perma.esp|
----------
Uses an ability which is handled by the mod internally.

