======================== Honed Metal Perk Definition File ========================

With the most recent update, the mod no longer makes use of compatibility patches, instead it reads the perks directly
from the game at runtime. This allows automatic compatibility with all perk overhaul mods right of the gate. However,
nothing is without cost; there are certain perks wich were only meant for the player and were not designed with
'NPC crafting' in mind, and while most of them are harmless some might have undersirable effects.
I will leave to the community the task of deciding which perk from which perk overhaul is problematic and should be blacklisted.

This file was created for that purpose. Perks defined here will not be used by the mod when deciding which perks to
assign to NPCs. Even when they have sufficient skill to use them.

There are two categories under which you can blacklist a perk: [BLACKLIST] OR [DUALENCH]. They behave similarly in
that both will blacklist perks, how they differ will be explained later. For now suffice it to say that both categories
must be capitalized, enclosed in braces and appear at the very start of a line.

There aren't many rules when it comes to blacklisting a perk, but the few that exist, are important. Please, read on.

1. Perks are validated by comparing them with loaded perks in-game. If the perk isn't found in-game, it wont be blacklisted.
2. The perk must begin with 0x or 0X, besides that, the first two nibbles (ff000000) of the formID should always be omitted
	or replaced with zeroes. These are the load order bits that change with the load order of the mod. The perk will
	fail validation if you include these bits.
3. There can be no characters other than spaces or tabs between the start of the line and the perk definition. If
	anything else is found, the line -and the perk- will be ignored.
4. After the first category definition i.e [.....], no other '[' character must appear at the start of a line other
	than the next category definition.
5. If modified, this file must be saved using an encoding type that uses 8-bits per character(I believe all latin languages do).
	When in doubt, default to UTF8. If saved using encodings from a different locale that makes use of extended character sets
	(like most Eastern European and Asian countries), the mod may not be able to parse it correctly.

 ==== Worth noting ====
    * Perks will only be imported upon a mod update, or after using the 'Repair' MCM option.
    * It isn't necessary to close the game to define a new perk, just update the file and use the MCM to instruct the mod to rescan the ini.
    * A report will be written in Data/SKSE/plugins/HonedMetal_plugin.log indicating each perk parsed.

==============================================
----------------------------------------------
[BLACKLIST]
Perks defined here will never be used when requesting crafting or enchanting services. Put undesirable/problematic
smithing and enchanting perks from your perk overhaul mod here, to avoid issues when requesting services.
Optional mod tags can be created to parse the perks defined within, only if the mod is loaded. This way one can safely define perks
for multiple mods without worrying that these perks will also be blacklisted for users that don't have these mods installed.
Mod tags are created by faithfully replicating the mod name within | | tags. e.g |Requiem.esp|
Perks defined before any mod tags will be blacklisted for all users, regardless of mod.

Note that plugin names defined within || tags can't be longer than 64 characters.
("This line is exactly 64 characters long if you need a reference.")
