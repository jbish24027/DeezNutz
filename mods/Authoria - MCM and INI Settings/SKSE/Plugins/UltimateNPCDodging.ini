[General]

######################################################################################################################################################################
#Depending on the NPC's dodging ability (aka protagonist_reflexes), they can utilize a dodge to close the distance on a enemy, or attempt to flank them (aka circle),
# or just generally back off from danger.
bTacticalDodgeAI_enable = false

######################################################################################################################################################################
#Enable Reactive Dodging (Aka trying a evade an incoming attack)
bDodgeAI_Reactive_enable = true

#######################################################################################################################################################################
#Enable iFrames with this mod, incase the dodge animation you have aren't patched with iFrames Generator(i.e., the mod) annotation.
#Requires the iFrames Generator mod installed to work.
biFrames_enable = true

#######################################################################################################################################################################
#Enable stamina costs (i.e. stamina drain) when NPC dodge. Disable if you have animations that are patched with stamina cost annotations (i.e. payload interpreter).
bStaminaCost_enable = true

#######################################################################################################################################################################
#Stamina checks and costs relating to side-steps. Setting this value to 0 essentially disables it.
fSideStep_staminacost = 10.0

#######################################################################################################################################################################
#Stamina checks and costs relating to dodge rolls. !!!!!THIS IS NOW A MULTIPLIER OF THE SIDESTEP COST (E.g, 25.0 X 1.6 = 40) !!!!!!!!!!!!!!.
fDodgeRoll_staminacost = 2.0

#######################################################################################################################################################################
# Also checks that the NPC has the "Silent Roll" Perk before allowing them to peform dodge rolls. Helps to make rogue/assassin type characters feel unique
# 1 = true, 0 = false
bHasSilentRollperk_enable = 1

#######################################################################################################################################################################
# Apart from the checks, the system generates a random floating number (i.e., decimal value) between 0.0 and 1.0. 
#And if this number is not greater than the the NPC's protagonist_reflex score, they will dodge, given they pass the checks for the specific type of attack 
#(e.g dodging a spell bolt requires the actor to have Line of sight to the attacker.

# This value below is a chance that the NPC will perfom a dodge roll (instead of a Sidestep). 
#NOTE - Max value = 10  and Min Value = 0 . DO NOT SET VALUES PAST THIS RANGE. Currently set to 2 (equivilent to 20%).
iDodgeRoll_ActorScaled_Chance = 2

#######################################################################################################################################################################
# If you use ZUPA Mod, you can add this check to ensure NPCs don't attempt to dodge while Drinking potions.
# Default = false. You don't use ZUPA, DO NOT ENABLE, else CTD.
bZUPA_mod_Check = false

#######################################################################################################################################################################
# If you use UAPNG Mod, you can add this check to ensure NPCs don't attempt to dodge while Drinking potions.
# Default = false. You don't use UAPNG, DO NOT ENABLE, else CTD.
bUAPNG_mod_Check = true

#######################################################################################################################################################################
# Enable general combat logging? Allows you to see details related to dodging like reflex scores, and stamina costs.
bCombatlogging_enable = false

#######################################################################################################################################################################
# Enable logging related to ranged-attack threat levels? (e.g., shouts, spells, bows, crossbows, etc)? Lower values are more threatning and higher values.
# displayed as "RSS_foe_threat" in the log.
bThreatlogging_enable = false


################################################ Protagnist_Reflex Score Factors #######################################################################################
#You can see Reflex Scores printed in the SKSE log "UND.log"when they successfully pass the score check. 
#(found in this path on your PC "Documents\My Games\Skyrim Special Edition\SKSE")
########################################################################################################################################################################
[Protagnist_Reflexes]

############################################################
####### All Add up to 1.0 ##################################
Sneak_Weighting = 0.0
Skirmish_Weighting = 0.2    # see [CombatStyle] section for contributing factors.
Defensive_Weighting = 0.5   # based on protagnist's combat style, defensive mult
Armour_Weighting = 0.3


##############################################################
[Armour]

############################################################
###### For Each: Max value = 1.0, Min Value = 0.0 #######
Heavyarm_mult = 0.0
Lightarm_mult = 0.7
clothing_mult = 1.0    #works for "Unclothed too"

############################################################
####### All Add up to 1.0 ##################################
Helm_weight = 0.1
Gauntlet_weight = 0.1
Boots_weight = 0.1
Chest_weight = 0.6
Shield_weight = 0.1   # No equipped shield gives max weighting (i.e. 0.1)


##############################################################
[CombatStyle]

##############################################################
####### All Add up to 1.0 ##################################
Skirmish_AvoidThreat_Weighting = 0.15
Skirmish_Fallback_Weighting = 0.15
Skirmish_Circle_Weighting = 0.4
Skirmish_Strafe_Weighting = 0.3


################################################ Stamina Cost Factors #######################################################################################
#You can see NPC stamina cost printed in the SKSE log "UND.log"when they successfully evade and attack.
#############################################################################################################################################################
# Base Stamina Cost accounts for the type of evasion (Sidestep or Dodge Roll cost), the mass of equipped armour, and counter-balance by the protagonist skill
# with the relevant armour (e.g., Heavy armour skill is used to counter-balance Heavy armour equipment).
# At Maximum Skill profociency, they protagonist is only charged (Evasion type base cost) + (the mass of equipped armour).
#######################################################################################################################################################################
[Stamina]

################################################################################
#Enable armour-based, stamina cost system.
bStaminaCost_ArmourBasedSystem_enable = false

###########################################################################################################
#This assess how much of the armour piece's mass is considered in the calculation.
#(e.g., if chest piece's mass is 30. And the Stamina_Chest_weight is 0.6, then (30 x0.6) = 18) is considered.
#############################################################################################################
###### For Each: Max value = 1.0, Min Value = 0.0 ##########
Stamina_Helm_weight = 1.0
Stamina_Gauntlet_weight = 1.0
Stamina_Boots_weight = 1.0
Stamina_Chest_weight = 1.0
Stamina_Shield_weight = 1.0

##############################################################################################################
#(E.g., if you have you a light (mass = 6), a and heavy (mass = 30) chest piece. if the Stamina_Chest_weight is 0.6, 
#but the Stamina_HeavyArmour_mult is 0.9, and the Stamina_LightArmour_mult = 2.0).
#Light Chest stamina cost = (2.0 X 0.6) X 6 = 7.2
#Heavy Chest stamina cost = (0.9 X 0.6) X 30 = 16.2
#########################################################################
###### For Each: Max value = As high as you want, Min Value = 0.0 #######
Stamina_HeavyArmour_mult = 1.0
Stamina_LightArmour_mult = 1.0
Stamina_Clothing_mult = 1.0
