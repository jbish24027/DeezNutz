[General]

; IMPORTANT NOTE: For balance effect probability scales with the health difference between attacker and target.
; This means setting effect values like fStaggerChance to 1.0 will NOT make the effect happen 100% of the time.
; Balance scaling will be tweakable in the future updates.

; Enable debug logging to see detailed information about hits and effects
bEnableDebugLogging = false

; Enable projectile damage (arrows, crossbow bolts)
bEnableProjectileDamage = true

; Enable weapon weight-based effect multiplier system
; When enabled, heavier weapons (warhammers, battleaxes) have increased chance for effects
; Light weapons (daggers, short swords) have reduced chance
bEnableWeaponWeightSystem = false

; Enable "Headshot" notification when player hits an enemy in the head
bEnableHeadshotNotification = false

; Enable weapon unequip effect for the player (when player gets hit in arm)
; If false, only NPCs can be disarmed
bEnablePlayerWeaponUnequip = false


[Head]

; Head hits deal 2x damage
fHealthDamageMult = 1.75

; Head hits drain magicka (base value, scales with attacker strength)
; Actual drain = base × attacker health multiplier (0.3x to 1.7x)
; Weak attacker: 12 × 0.3 = ~4 | Equal: 12 | Strong: 12 × 1.7 = ~20
fMagickaDamage = 12.0

; 40% chance to interrupt spellcasting
fInterruptChance = 0.3

; 2% chance to knockdown 
; Note: Races with No Knockdowns flag are immune
fKnockdownChance = 0.00


[Torso]

; Torso hits deal normal damage
fHealthDamageMult = 1.0

; Torso hits drain stamina (base value, scales with attacker strength)
; Actual drain = base × attacker health multiplier (0.3x to 1.7x)
; Weak attacker: 12 × 0.3 = ~4 | Equal: 12 | Strong: 12 × 1.7 = ~20
fStaminaDamage = 0.0

; 10% chance to interrupt
fInterruptChance = 0.0


[Arms]

; Arm hits deal 0.75x damage
fHealthDamageMult = 1.00

; Chance to disarm 
; Doesn't apply to essential NPCs
; NPCs will naturally re-equip via vanilla AI behavior (~1-2 seconds)
fUnequipWeaponChance = 0.00

; 8% chance to slow weapon speed
fDecreaseWeaponSpeedChance = 0.00

; Weapon speed reduced to 80% 
fWeaponSpeedMult = 1.0

; Weapon speed debuff lasts 4 seconds
fWeaponSpeedDuration = 0.0


[Legs]

; Leg hits deal 0.75x damage
fHealthDamageMult = 1.00

; 8% chance to stagger
fStaggerChance = 0.00

; 10% chance to slow movement
fDecreaseMovementSpeedChance = 0.00

; Movement speed reduced to 80% 
fMovementSpeedMult = 1.0

; Movement speed debuff lasts 4 seconds
fMovementSpeedDuration = 0.0
