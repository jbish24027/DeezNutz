notes="Frees 3 SkyUI MCM slots. Built 2026-08-28 after the live Papyrus log showed the MCM list at 128/128 with 134 menus competing for it. Clears Start Game Enabled on three menu-only quests so they never register: BetterThirdPersonSelection_MCM (000D62), OBodyNGMCMQuest (000D6B), VL_ConfigMenu (005901). All three verified menu-host-only, unreferenced, and doing no work at game load. TAKES EFFECT ON A NEW GAME ONLY. Outfit Recognition was evaluated SAFE but deliberately NOT cut - it would lock ORF to maximum chattiness. Bow Rapid Combo was on the 2026-08-19 list but is NOT safe: its MCM script is the mod's keybind store. Supersedes the reverted 2026-08-19 MCM Slot Trim; that revert was later traced to the SKI_ConfigManager BUSY race, fixed separately by RebuildMcmRegistrations."
