; RacemenuHeadpartsExcluder - hide non-hair head parts from UBE races in chargen.

[General]
; 0=critical 1=err 2=warn 3=info 4=debug 5=trace.
logLevel = 2

; 1 = run the load-time pass (normal). 0 = do nothing (safe disable).
enabled = 1

; 1 = only touch Playable head parts (the ones chargen actually shows). Recommended.
onlyPlayable = 1

; 1 = log any UBE-carrying race list that has no mapping (parts on it still show on
;     UBE). Leave on to catch coverage gaps; harmless.
reportGaps = 1

; Plugin that defines the UBE races - used only by the coverage-gap report above.
ubePlugin = UBE_AllRace.esp

[Types]
; Which head-part categories to HIDE from UBE races. 1 = hide (repoint), 0 = keep.
; Defaults below: hide everything UBE supplies its own of; keep Hair + beards, since
; UBE has none of its own (hiding them would leave UBE bald / beardless).
Misc       = 1
Face       = 1
Eyes       = 1
Scar       = 1
Eyebrows   = 1
Hair       = 0
FacialHair = 0

; [Lists]
; Optional: add mappings for mod-specific race lists the coverage-gap report flags.
; Format:  <origID>~<origPlugin> = <customID>~<customPlugin>
; Example: 0x000ABC~SomeMod.esp = 0x000DEF~CustomRaces_NoVanilaHeadParts.esp
