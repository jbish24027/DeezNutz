; RacemenuSexDisabler - hide character-creation races for the "wrong" sex.
;
; [Races] line format:
;     <FormID>~<Plugin.esp> = <Male|Female>
;     <EditorID>           = <Male|Female>
;   The value is the sex for which the race should NOT appear.
;   "= Male" therefore makes the race female-only (hidden while Male).

[General]
; spdlog real table: 0=trace 1=debug 2=info 3=warn 4=err 5=critical (the old
; comment here was inverted). 1 = debug; do not use 0 while playing.
logLevel = 1

; 1 = install the RaceSexMenu vtable hooks (normal operation).
; 0 = event-sink diagnostic only (no vtable hooks). Set to 0 ONLY if chargen
;     crashes, to confirm whether the vtable hooks are the cause, then report.
enableMenuHooks = 1

[Races]
; --- Half-Khajiit (Ohmes-Raht): female-only (hidden while Male). ---
0x03322B~HalfKhajiit.esp = Male

; --- Vanilla human/elf races: hidden while FEMALE, so female players get the UBE
;     versions instead. Beasts (Khajiit/Argonian) are excluded - no UBE variant, so
;     they stay available for both sexes. ---
0x013741~Skyrim.esm = Female   ; BretonRace
0x013744~Skyrim.esm = Female   ; ImperialRace
0x013746~Skyrim.esm = Female   ; NordRace
0x013748~Skyrim.esm = Female   ; RedguardRace
0x013742~Skyrim.esm = Female   ; DarkElfRace
0x013743~Skyrim.esm = Female   ; HighElfRace
0x013749~Skyrim.esm = Female   ; WoodElfRace
0x013747~Skyrim.esm = Female   ; OrcRace

; --- UBE races: hidden while MALE, so male players get the vanilla versions instead.
;     Only the 8 Playable UBE races appear in chargen; the vampire variants and
;     CustomRace01/02 are non-playable and never listed. ---
0x005734~UBE_AllRace.esp = Male   ; 00UBE_BretonRace
0x05A179~UBE_AllRace.esp = Male   ; 00UBE_ImperialRace
0x05A184~UBE_AllRace.esp = Male   ; 00UBE_NordRace
0x05A18E~UBE_AllRace.esp = Male   ; 00UBE_RedguardRace
0x05A198~UBE_AllRace.esp = Male   ; 00UBE_DarkElfRace
0x05A1A2~UBE_AllRace.esp = Male   ; 00UBE_HighElfRace
0x05A1AC~UBE_AllRace.esp = Male   ; 00UBE_WoodElfRace
0x05A1B0~UBE_AllRace.esp = Male   ; 00UBE_OrcRace
