; Authoria - Auto Combat Dodge (AutoCombatDodge.dll)
; Makes the player dodge with TK Dodge RE while Auto Combat is fighting for them.
; It never does anything while you play by hand. Log: Documents\My Games\Skyrim Special Edition\SKSE\AutoCombatDodge.log
; Read once at game start - restart the game after editing.

[General]
; 1 = on, 0 = off (nothing is hooked at all)
Enabled = 1

; 0 = warnings only, 1 = normal, 2 = every decision (why a dodge fired or was skipped)
LogLevel = 1

; How it knows Auto Combat is fighting:
; 0 = read Auto Combat's own on/auto-pilot switches (exact); if that fails it falls back to watching Auto Combat's hotkey
; 1 = only watch Auto Combat's hotkey (fallback mode; can get out of step if you flip Auto Combat from its menu page)
; 2 = ignore Auto Combat and dodge in every fight (for testing only)
ActivationMode = 0

; 1 = dodge only while the auto-pilot is actually walking you to a target and attacking
; 0 = dodge whenever Auto Combat is switched on (even while it only alerts targets)
RequireAutoPilot = 1

; Key the hotkey mirror watches (DirectInput scan code). 0 = use Hotkey= from AutoCombat.ini (K = 37)
MirrorHotkey = 0

; 1 = short on-screen note when auto-dodge arms / disarms
Notifications = 0

[Dodge]
; Percent of detected enemy attacks that get a dodge
Chance = 60
; Seconds between auto-dodges
Cooldown = 1.2
; Never dodge below this much stamina (percent of max) - keeps stamina for Requiem blocking/attacks
MinStaminaPercent = 25
; Only attacks that start within this distance (game units; ~130 = 2 m) are dodged
DetectionRadius = 420
; The attacker must be facing you within +/- this many degrees
FacingConeDegrees = 60
; Seconds between the enemy's wind-up and the dodge (TK Dodge i-frames last 0.3 s)
ReactionDelay = 0.10
; Percent of attacks from the front dodged sideways instead of backwards
SideDodgeChance = 35
; While your own attack is playing: 0 = never cancel it, 1 = only in the cancel window TK Dodge / MCO allow (IsAttackReady / MCO_IsInRecovery), 2 = cancel any normal attack. Power attacks are never cancelled.
AttackCancel = 1
; 1 = obey TK Dodge's Requiem perk lock (no dodge until the perk is learned), as a hand dodge does
RespectPerkLock = 1

[Projectiles]
; 1 = also side-step arrows, bolts and missile spells aimed at you
DodgeProjectiles = 0
; Only projectiles closer than this are considered (game units)
ProjectileRadius = 2500
; React when the projectile is this many seconds from hitting you
WarningTime = 0.45
; Only dodge projectiles predicted to pass within this distance of you
HitRadius = 110
