
; Eight runtime-created routing keywords
;   AuthoriaCC_ExoticArmour  -- HEAVY|LIGHT armours from the 61-plugin modded set
;   AuthoriaCC_ExoticWeapon  -- weapons from the 61-plugin modded set
;   AuthoriaCC_Backpack      -- per-FormID enumeration of 16 backpack/satchel items
;   AuthoriaCC_Wig           -- ARMO from the three Dint999 wig/hair plugins
;   AuthoriaCC_Lantern       -- handheld lantern MISC items + vanilla Lantern01
;   AuthoriaCC_Padding       -- the 6 REQ_Padding_Cloth_* armour layer items
;   AuthoriaCC_Cloak         -- 12 cloak/hood items across 7 plugins
;   AuthoriaCC_FactionWeapon -- Dawnguard weapons (no faction-keyword existed on them)
;
; KID grammar reminder (per powerof3/Keyword-Item-Distributor master):
;   Keyword = formID~esp|type|filters|traits|chance
;   filters: comma-separated. + = ALL chain, - = NOT, * = ANY substring, no-prefix = MATCH
;   Each entry processed independently against item; ALL/NOT/MATCH/ANY groups AND together.
;   For ArmorTraits, only one armorType (HEAVY|LIGHT|CLOTHING) per line -- needs two lines for HEAVY+LIGHT.

