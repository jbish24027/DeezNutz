# Girth value treated as normal thickness for scale.
# Higher values make girth-based scaling less sensitive.
GirthReference = 1.4

# Maximum normalized girth multiplier used for scale.
# Prevents oversized members from creating unstable effects.
GirthCap = 4.6

# How far the belly node pushes outward from penetration depth.
# This is not multiplied by girth.
DisplacementStrength = 18.0

# How strongly the belly node rotates from the vaginal/anal pressure source direction.
RotationStrength = 0.52

# Small girth-driven scale layer used to make the bulge look thicker.
# Keep low to avoid a round balloon look.
ScaleFactor = 0.02

# Multiplier for anal belly bulge pressure.
# Lower values make anal penetration affect the belly less.
AnalMultiplier = 0.65

# Amount of animated noise added to belly translation/rotation for livelier motion.
NoiseStrength = 1.07

# How quickly the belly noise phase advances over time.
NoiseSpeed = 2.0

# How tight or jittery the noise pattern is.
# Higher values can mimic ripples or ribbed insertion.
NoiseFrequency = 1.5

# Small noise pulse added to scale for surface motion.
ScaleNoiseStrength = 0.02

# Smoothing speed for belly physics.
# Higher values respond faster; lower values feel heavier.
SmoothStrength = 19.0