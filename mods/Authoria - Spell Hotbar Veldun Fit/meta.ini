comments="Authoria 2026-08-18, keybinds added 2026-08-28. One MCM-loadable preset that carries BOTH the 3840x2160 sizing AND the numpad keybinds. Cloned from Spell Hotbar's own Default.json. SIZING: slot_scale 1.0 -> 0.7735, slot_spacing 8 -> 12, offset_y 0 -> 19. 0.7735 is deliberate: it makes a slot exactly 128 px at H=2160, 1:1 with every source texture (all atlases are 128 px cells), so the frame and icons stop being upscaled 1.3x and render crisp. The MCM slider cannot reach that value (0.01 steps give 127 or 129 px) - only a preset file can, because the native setter is unclamped. KEYBINDS: slots 1-10 = Numpad 1-9 and 0, slot 11 = Numpad *, slot 12 = Numpad Enter, Next Bar = Numpad +, Prev Bar = Numpad -. DX scan codes 79 80 81 75 76 77 71 72 73 82 55 156 / 78 74. Numpad . (83) is left free on purpose - it is Campfire harvest-wood in 'Authoria - MCM and INI Settings'; Numpad / (181) left free for OStim freecam. Next/Prev Bar only fire inside the Magic Menu, so sharing + and - with OStim scene keys is harmless. NumLock state does not matter - Skyrim reads DirectInput scan codes. Load via MCM > Spell Hotbar > Presets > Load Config > 'Authoria Veldun Fit'. NOTE: loading any preset rewrites ALL keybinds, sizing and per-bar flags from the file, so load this LAST if you have hand-tuned anything in the MCM. Pre-keybind copy of the json: backups/SpellHotbar-Authoria-Veldun-Fit.json.bak-prenumpad-20260828."
