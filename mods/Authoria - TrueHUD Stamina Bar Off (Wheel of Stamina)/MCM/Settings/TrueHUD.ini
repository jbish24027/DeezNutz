[Colors]

; Colors should be in hex format or the game might crash!
; Penalty Color: for example the survival mode penalty color, usually dark red. Default: 5F0000
; Phantom color: the color that appears briefly when taking damage. Default white: ffffff
; Background color: Dragonborn Reskin TrueHUD does not have background, so no use changing these!
sHealthColor = ab2b2f

