nexusDescription="[size=3]This is a public version of my Requiem Lite mod which alleviates some of the more tedious parts of Requiem, making it more friendly for people learning the overhaul. I truly think that Requiem is one of the most fun and satisfying ways to play Skyrim so hopefully these tweaks will help more people get comfortable with it. \n<br />\n<br />Another tip for new Requiem players, [url=https://next.nexusmods.com/profile/IxionXVII/about-me?gameId=1704]IxionXVII[/url] has made patches for several of [url=https://next.nexusmods.com/profile/EnaiSiaion/about-me?gameId=1704]EnaiSiaion's[/url] mods such as Wintersun, Growl, Sacrilege and Andromeda. These will further help make the experience much less cumbersome and focus on the Role-Playing element of Requiem :) \n<br />\n<br />\n<br />In 2.0 Requiem Lite has been completely reworked.\n<br />\n<br />Now, it mostly just gives the player some starting stats that can be abled/disabled at any time. You are given extra armor rating, magic resistance, health/magicka/stamina regen, lockpicking expertise. This should allow for the early game to not be as brutal for new players.\n<br />\n<br />[/size][b]Place this mod after Requiem and all Requiem-related patches. [/b]"
