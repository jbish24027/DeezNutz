; ==========================================================================
;  DynamicFurMorphNG - Modded LOWER-BODY armor on NON-STANDARD biped slots
;  (Phase 3). The DLL fallback only covers slots 32/33/37; these pieces sit on
;  slots 44-58, so without an FM keyword the leg/pelvis/thigh fur clips through.
;  The keyword path is slot-agnostic, so an FM keyword here drives correctly.
;  FormID-based (Requiem/Reqtificated rename names+editorids). FEMALE FM_* only
;  - these are predominantly female-body armors; male modded lower-body is left
;  to the slot-32/33/37 fallback (see handoff).
;  Found via slot-mask sweep (BodyTemplate.FirstPersonFlags) + name classify.
; ==========================================================================

