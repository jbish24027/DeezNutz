; ==========================================================================
;  DynamicFurMorphNG - Modded UPPER-BODY / ARM / NECK armor on NON-STANDARD
;  biped slots (Phase 3b). The DLL fallback only covers slots 32/33/37, so
;  shoulder/neck/forearm/torso-overlay pieces on slots 34/44-59 clip the fur
;  with no FM keyword. Keyword path is slot-agnostic -> these drive correctly.
;  FormID-based (Requiem/Reqtificated rename names+editorids). FEMALE FM_ only
;  (predominantly female/unisex pieces; male upper-body left to the fallback).
;  Found via slot-mask sweep (BodyTemplate.FirstPersonFlags) + name classify.
;
;  HELD OUT (deliberate, see KID Distribution doc):
;   - FurSet by Keung (~150 recs): NonPlayable / Reqtificator-nulled (REQ_NULL_AM)
;     -> not worn in ARR. Tag the base FurSet by keung.esp FormIDs only if you
;     integrate it and Khajiit NPCs wear it (ShoulderCape->FM_Shoulder,
;     Poncho/Coat->FM_Top, OpenFingerGloves->FM_Glove).
;   - Requiem REQ_Padding_* (slot 56): worn under an already-FM_FullBody cuirass
;     -> tagging FM_Top would double-shrink. Revisit only if padding-worn-alone clips.
; ==========================================================================

