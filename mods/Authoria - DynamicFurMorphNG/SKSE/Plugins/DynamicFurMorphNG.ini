; ============================================================================
;  DynamicFurMorphNG.ini  -  runtime config for the SKSE port of Dynamic Fur Morph
;  Install path:  Data\SKSE\Plugins\DynamicFurMorphNG.ini
;  Every key is optional; delete the file to use the built-in defaults below.
; ============================================================================

[General]
; Log verbosity written to ...\My Games\Skyrim Special Edition\SKSE\DynamicFurMorphNG.log
;   0=critical  1=error  2=warn  3=info  4=debug  5=trace
LogLevel = 3

; Keyword-name prefix that marks a fur-morph instruction on an armor piece.
; KID distributes keywords like  FM_Uni_Body[0.5]  onto armors; this matches "FM".
FMPrefix = FM

; fur actor whose race does NOT carry this keyword has its neck fur morphed away.
NeckKeyword = 0x805~Fur_Morph.esp
NeckMorph   = FM_NoNeckFur

; always-on morph that keeps the morph key registered (visually negligible).
ApplyKeySeed = true
KeySeedMorph = FM_KeySeed
KeySeedValue = 0.01

[Fallback]
; Applied to armor that carries NO FM keyword, picked by the biped slot it occupies.
;   body = slot 32, hands = slot 33, feet = slot 37
Body  = FM_Uni_Body
Hands = FM_Uni_Hands
Feet  = FM_Uni_Feet

[Races]
; Actors of these races get dynamic fur morphs. One "Race =" line per race.
; Syntax:  0xHexFormID~Plugin.esp   (a raw EditorID also works if EditorIDs are
; exported at runtime, e.g. with powerofthree's Tweaks).
;
; Add a line here only for races that wear the fur shell.
Race = 0x13745~Skyrim.esm        ; KhajiitRace
Race = 0x88845~Skyrim.esm        ; KhajiitRaceVampire
Race = 0x3322B~HalfKhajiit.esp   ; HalfKhajiitRace
Race = 0x5693A~HalfKhajiit.esp   ; HalfKhajiitRaceVampire