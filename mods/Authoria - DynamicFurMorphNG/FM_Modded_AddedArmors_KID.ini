; ==========================================================================
;  DynamicFurMorphNG - added skimpy 3BA armor mods (batch added 2026-06-25).
;  Slot = 30 + bit index of BodyTemplate.FirstPersonFlags. The DLL fallback
;  shrinks FM_Uni_Body for any slot-32 piece, FM_Uni_Hands (33), FM_Uni_Feet
;  (37) - so full slot-32 body pieces and std-slot gloves/boots need NOTHING.
;  Tagged here: pieces on non-standard slots + skimpy partial slot-32 pieces
;  where the whole-body fallback would over-shrink the exposed skin. FEMALE FM_.
;
;  Rides the fallback, NOT listed (full slot-32 body + std-slot accessories):
;    Shanoa Armor (Shanoa Armor.esp), Midnight Mistress (Midnight Mistress.esp),
;    Asura's "Combined" full armor + Vambraces/Heels/Sabatons/Helmets.
;  NOT tagged - Asura's Stockings (000D88) sit on slot 60, the Khajiit fur-shell
;    slot: wearing them unequips the fur shell, so there's no fur to morph (a mod
;    slot-conflict, flag for Heisen).
; ==========================================================================

; --- Obi's Abyss Armor (skimpy top; lower body bare -> regional, not fallback) ---
Keyword = FM_Top|Armor|0x000D66~Obi's Abyss Armor.esp

; --- Obi's Cimmerian (barbarian: top + loincloth + shoulder + forearm gloves) ---
; Top (slot 32)
Keyword = FM_Top|Armor|0x000D6A~Obi's Cimmerian.esp
; Gloves on slot 34 (Forearms) - no fallback there
Keyword = FM_Glove|Armor|0x000D6B~Obi's Cimmerian.esp
; Waist loincloth (slot 49, pelvis)
Keyword = FM_Panty|Armor|0x000D6C~Obi's Cimmerian.esp
; Shoulder (slot 57)
Keyword = FM_Shoulder|Armor|0x000D6D~Obi's Cimmerian.esp

; --- Asura's Guard [Armor] (modular; non-standard-slot pieces + the Bra) ---
; Bra (slot 32, chest)
Keyword = FM_Bra|Armor|0x000D87~Asuras Guard [Armor].esp
; Gorget (slot 44, neck)
Keyword = FM_Neck|Armor|0x000D7B~Asuras Guard [Armor].esp
; Top (slot 45), Chainmail (46), Chestplate (56), Cuirass (59) - torso layers
Keyword = FM_Top|Armor|0x000D7C~Asuras Guard [Armor].esp
Keyword = FM_Top|Armor|0x000D7D~Asuras Guard [Armor].esp
Keyword = FM_Top|Armor|0x000D84~Asuras Guard [Armor].esp
Keyword = FM_Top|Armor|0x000D76~Asuras Guard [Armor].esp
; Skirt (slot 48) + Tasset (slot 49) - hip drapes
Keyword = FM_Skirt|Armor|0x000D7F~Asuras Guard [Armor].esp
Keyword = FM_Skirt|Armor|0x000D80~Asuras Guard [Armor].esp
; Pants (slot 52, pelvis)
Keyword = FM_Pants|Armor|0x000D81~Asuras Guard [Armor].esp
; Cuisse (slot 53, thighs)
Keyword = FM_Thigh_L|Armor|0x000D82~Asuras Guard [Armor].esp
Keyword = FM_Thigh_R|Armor|0x000D82~Asuras Guard [Armor].esp
; Greaves (slot 54, shins)
Keyword = FM_Boot|Armor|0x000D83~Asuras Guard [Armor].esp
; Pauldrons (slot 57, shoulders)
Keyword = FM_Shoulder|Armor|0x000D85~Asuras Guard [Armor].esp
; Sleeves (slot 58, arms)
Keyword = FM_Glove|Armor|0x000D86~Asuras Guard [Armor].esp

