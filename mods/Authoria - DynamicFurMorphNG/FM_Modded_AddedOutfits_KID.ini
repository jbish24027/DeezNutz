; ==========================================================================
;  DynamicFurMorphNG - newly-added outfit mods (batch added 2026-06-24).
;  Append future added-mod lines here.
;
;  Only pieces the DLL fallback CAN'T serve are tagged. The fallback shrinks
;  FM_Uni_Body for any slot-32 piece (covers torso+arms+legs), FM_Uni_Hands for
;  slot-33, FM_Uni_Feet for slot-37. So full-coverage standard-slot armor needs
;  NOTHING here and is intentionally omitted:
;    Kad MoonMonkRobes, el Gilded Doublet, [FB] Arcane Mage Armor, Apex_Khajiit,
;    Bone Cultist Armor, 1AncArgArm (Ancient Argonian), DDV Hal's Casual Outfit,
;    s6o6tStormholdWarriorArmor (Saxhleel, Body+Calves) -> all ride the fallback.
;    AncientArg_Weightslider has no ARMO records.
;
;  Tagged = Traveler's Romper 3BA only: a skimpy modular outfit with pieces on
;  non-standard slots (no fallback fires) + skimpy slot-32 tops where the
;  whole-body fallback would over-shrink the exposed skin. FEMALE FM_ only.
; ==========================================================================

; --- Traveler's Romper Outfit 3BA ---
; Bra (slot 32, chest only - regional morph beats the whole-body fallback)
Keyword = FM_Bra|Armor|0x000D69~Traveler's Romper Outfit 3BA.esp
; Top + Top Black (slot 32; treated as a crop/romper top - if it's actually
; full-sleeved, delete these two lines and let the fallback handle it)
Keyword = FM_Top|Armor|0x000D6D~Traveler's Romper Outfit 3BA.esp
Keyword = FM_Top|Armor|0x000D74~Traveler's Romper Outfit 3BA.esp
; Panties (slot 52 pelvis - no fallback fires here)
Keyword = FM_Panty|Armor|0x000D67~Traveler's Romper Outfit 3BA.esp
; Stockings (slot 38 calves - no fallback; FM_Thigh covers the leg, swap to
; FM_Boot if the lower calf still clips)
Keyword = FM_Thigh_L|Armor|0x000D65~Traveler's Romper Outfit 3BA.esp
Keyword = FM_Thigh_R|Armor|0x000D65~Traveler's Romper Outfit 3BA.esp
; Shemaghs (slot 35 amulet, neck scarf - only matters for neck-fur Khajiit)
Keyword = FM_Neck|Armor|0x000D72~Traveler's Romper Outfit 3BA.esp
Keyword = FM_Neck|Armor|0x000D6F~Traveler's Romper Outfit 3BA.esp
