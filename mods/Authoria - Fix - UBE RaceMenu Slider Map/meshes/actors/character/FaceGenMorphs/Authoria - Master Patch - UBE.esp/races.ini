# Determines what sliders are available for the particular race
#
# Authoria fix: four addon mods (Chooey Dint Ears, Cuyi Antlers, Lashivious
# Lashes, LDD Beards) re-mapped every UBE race to a ~2KB VANILLA-HUMAN slider
# set, overriding UBE's own 74KB JohnWick.ini. That made skee fall back to
# NordRace and fail every morph bind (UBE head 11498 verts vs vanilla 996),
# killing all sliders, eyes, brows and lashes on UBE races.
#
# UBE_Merged.ini = JohnWick.ini + all four addons' slider entries.
# Hosted on 'Authoria - Master Patch - UBE.esp' (load order 3805) so it wins
# over every earlier registrant. CustomRace01/02 added - UBE's own races.ini
# omits them.

00UBE_BretonRace             = sliders\UBE_Merged.ini
00UBE_BretonRaceVampire      = sliders\UBE_Merged.ini
00UBE_ImperialRace           = sliders\UBE_Merged.ini
00UBE_ImperialRaceVampire    = sliders\UBE_Merged.ini
00UBE_NordRace               = sliders\UBE_Merged.ini
00UBE_NordRaceVampire        = sliders\UBE_Merged.ini
00UBE_RedguardRace           = sliders\UBE_Merged.ini
00UBE_RedguardRaceVampire    = sliders\UBE_Merged.ini
00UBE_DarkElfRace            = sliders\UBE_Merged.ini
00UBE_DarkElfRaceVampire     = sliders\UBE_Merged.ini
00UBE_HighElfRace            = sliders\UBE_Merged.ini
00UBE_HighElfRaceVampire     = sliders\UBE_Merged.ini
00UBE_WoodElfRace            = sliders\UBE_Merged.ini
00UBE_WoodElfRaceVampire     = sliders\UBE_Merged.ini
00UBE_OrcRace                = sliders\UBE_Merged.ini
00UBE_OrcRaceVampire         = sliders\UBE_Merged.ini
00UBE_CustomRace01           = sliders\UBE_Merged.ini
00UBE_CustomRace02           = sliders\UBE_Merged.ini

