; ========================================================================
;  Outfit Recognition Framework  --  DBM_CC_CivilWarChampionsHOWPatch.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Sturdy -- 2 item(s): Imperial Dragon Armor (replica), Storm-Bear Armor (replica)
Keyword = ORF_Sturdy|Armor|0x00084B~DBM_CC_CivilWarChampionsHOWPatch.esp,0x00084E~DBM_CC_CivilWarChampionsHOWPatch.esp

; ORF_Red -- 1 item(s): Imperial Dragon Armor (replica)
Keyword = ORF_Red|Armor|0x00084E~DBM_CC_CivilWarChampionsHOWPatch.esp

; ORF_Grey -- 1 item(s): Storm-Bear Armor (replica)
Keyword = ORF_Grey|Armor|0x00084B~DBM_CC_CivilWarChampionsHOWPatch.esp
