; ========================================================================
;  Outfit Recognition Framework  --  Girl's Travel Outfit Recolors.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Black -- 5 item(s): Girl's Travel Outfit Black, Girl's Travel Outfit Brown, Girl's Travel Outfit Green
Keyword = ORF_Black|Armor|0x000D6A~Girl's Travel Outfit Recolors.esp,0x000D6C~Girl's Travel Outfit Recolors.esp,0x000D6D~Girl's Travel Outfit Recolors.esp,0x000D6E~Girl's Travel Outfit Recolors.esp,0x000D6F~Girl's Travel Outfit Recolors.esp

; ORF_Brown -- 1 item(s): Girl's Travel Outfit Brown
Keyword = ORF_Brown|Armor|0x000D6B~Girl's Travel Outfit Recolors.esp
