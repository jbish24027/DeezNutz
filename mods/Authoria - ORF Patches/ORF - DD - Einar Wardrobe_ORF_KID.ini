; ========================================================================
;  Outfit Recognition Framework  --  DD - Einar Wardrobe.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 1 item(s): Einar WardRobe Hood
Keyword = ORF_Hooded|Armor|0x000810~DD - Einar Wardrobe.esp

; ORF_Robes -- 8 item(s): Einar WardRobe Hip Towel, Einar WardRobe Tunic, Einar WardRobe Tunic 2 ...
Keyword = ORF_Robes|Armor|0x000801~DD - Einar Wardrobe.esp,0x00080C~DD - Einar Wardrobe.esp,0x00080E~DD - Einar Wardrobe.esp,0x000820~DD - Einar Wardrobe.esp,0x000822~DD - Einar Wardrobe.esp,0x000843~DD - Einar Wardrobe.esp
Keyword = ORF_Robes|Armor|0x000845~DD - Einar Wardrobe.esp,0x000847~DD - Einar Wardrobe.esp

; ORF_Brown -- 6 item(s): Einar WardRobe Tunic, Einar WardRobe Tunic 3, Einar WardRobe pants body ...
Keyword = ORF_Brown|Armor|0x000801~DD - Einar Wardrobe.esp,0x00080C~DD - Einar Wardrobe.esp,0x000820~DD - Einar Wardrobe.esp,0x000843~DD - Einar Wardrobe.esp,0x000845~DD - Einar Wardrobe.esp,0x000847~DD - Einar Wardrobe.esp

; ORF_Grey -- 2 item(s): Einar WardRobe Hip Towel, Einar WardRobe Tunic 2
Keyword = ORF_Grey|Armor|0x00080E~DD - Einar Wardrobe.esp,0x000822~DD - Einar Wardrobe.esp
