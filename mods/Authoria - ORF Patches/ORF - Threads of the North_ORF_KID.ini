; ========================================================================
;  Outfit Recognition Framework  --  Threads of the North.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 3 item(s): Dunmer Outfit
Keyword = ORF_Hooded|Armor|0x00006A~Threads of the North.esp,0x00006B~Threads of the North.esp,0x00006C~Threads of the North.esp

; ORF_Brown -- 6 item(s): Dunmer Outfit
Keyword = ORF_Brown|Armor|0x000067~Threads of the North.esp,0x000068~Threads of the North.esp,0x000069~Threads of the North.esp,0x00006A~Threads of the North.esp,0x00006B~Threads of the North.esp,0x00006C~Threads of the North.esp
