; ========================================================================
;  Outfit Recognition Framework  --  FalmerSlayer.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Underwear -- 1 item(s): Falmer Slayer Panty
Keyword = ORF_Underwear|Armor|0x000D75~FalmerSlayer.esp

; ORF_Tight -- 1 item(s): Falmer Slayer Bodysuit
Keyword = ORF_Tight|Armor|0x000D6E~FalmerSlayer.esp

; ORF_Sturdy -- 2 item(s): Falmer Slayer Armor, Falmer Slayer Armor 2
Keyword = ORF_Sturdy|Armor|0x000800~FalmerSlayer.esp,0x000D81~FalmerSlayer.esp

; ORF_Intimidating -- 2 item(s): Falmer Slayer Armor, Falmer Slayer Armor 2
Keyword = ORF_Intimidating|Armor|0x000800~FalmerSlayer.esp,0x000D81~FalmerSlayer.esp

; ORF_Green -- 2 item(s): Falmer Slayer Armor, Falmer Slayer Armor 2
Keyword = ORF_Green|Armor|0x000800~FalmerSlayer.esp,0x000D81~FalmerSlayer.esp
