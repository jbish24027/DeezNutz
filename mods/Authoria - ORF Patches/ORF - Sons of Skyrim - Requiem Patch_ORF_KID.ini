; ========================================================================
;  Outfit Recognition Framework  --  Sons of Skyrim - Requiem Patch.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 1 item(s): Stormcloak Nasal Iron Helmet with 
Keyword = ORF_Hooded|Armor|0x00098E~Sons of Skyrim - Requiem Patch.esp

; ORF_Leather -- 1 item(s): Stormcloak Chainmail with Leather 
Keyword = ORF_Leather|Armor|0x00093A~Sons of Skyrim - Requiem Patch.esp

; ORF_Sturdy -- 6 item(s): Eastmarch Guard Cuirass, Stormcloak Chainmail, Stormcloak Chainmail with Leather  ...
Keyword = ORF_Sturdy|Armor|0x000938~Sons of Skyrim - Requiem Patch.esp,0x000939~Sons of Skyrim - Requiem Patch.esp,0x00093A~Sons of Skyrim - Requiem Patch.esp,0x00093B~Sons of Skyrim - Requiem Patch.esp,0x0009A3~Sons of Skyrim - Requiem Patch.esp,0x0009A4~Sons of Skyrim - Requiem Patch.esp

