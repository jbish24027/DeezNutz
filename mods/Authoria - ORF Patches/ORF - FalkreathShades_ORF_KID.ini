; ========================================================================
;  Outfit Recognition Framework  --  FalkreathShades.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 1 item(s): Unliving Visage
Keyword = ORF_Hooded|Armor|0x1F6F44~FalkreathShades.esp

; ORF_Sturdy -- 2 item(s): Arkayn Armor, Noble's Armor
Keyword = ORF_Sturdy|Armor|0x0FE2AD~FalkreathShades.esp,0x58E72B~FalkreathShades.esp

; ORF_Classy -- 1 item(s): Noble's Armor
Keyword = ORF_Classy|Armor|0x58E72B~FalkreathShades.esp

; ORF_Grey -- 2 item(s): Arkayn Armor, Noble's Armor
Keyword = ORF_Grey|Armor|0x0FE2AD~FalkreathShades.esp,0x58E72B~FalkreathShades.esp
