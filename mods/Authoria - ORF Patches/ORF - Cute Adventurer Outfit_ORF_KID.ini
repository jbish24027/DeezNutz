; ========================================================================
;  Outfit Recognition Framework  --  Cute Adventurer Outfit.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Dress -- 3 item(s): Confident Adventurer Dress, Cute Adventurer Dress, Rich Adventurer Dress
Keyword = ORF_Dress|Armor|0x000D34~Cute Adventurer Outfit.esp,0x000D3D~Cute Adventurer Outfit.esp,0x000D4B~Cute Adventurer Outfit.esp

; ORF_Underwear -- 3 item(s): Confident Adventurer Shorts, Cute Adventurer Shorts, Rich Adventurer Shorts
Keyword = ORF_Underwear|Armor|0x000D36~Cute Adventurer Outfit.esp,0x000D51~Cute Adventurer Outfit.esp,0x000D52~Cute Adventurer Outfit.esp

; ORF_Blue -- 1 item(s): Confident Adventurer Dress
Keyword = ORF_Blue|Armor|0x000D3D~Cute Adventurer Outfit.esp

; ORF_White -- 1 item(s): Cute Adventurer Dress
Keyword = ORF_White|Armor|0x000D4B~Cute Adventurer Outfit.esp

; ORF_Brown -- 1 item(s): Rich Adventurer Dress
Keyword = ORF_Brown|Armor|0x000D34~Cute Adventurer Outfit.esp
