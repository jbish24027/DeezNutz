; ========================================================================
;  Outfit Recognition Framework  --  Towels.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Blue -- 2 item(s): Towel Body Blue, Towel Waist Blue
Keyword = ORF_Blue|Armor|0x00080F~Towels.esp,0x000845~Towels.esp

; ORF_Black -- 2 item(s): Towel Body Black, Towel Waist Black
Keyword = ORF_Black|Armor|0x00080D~Towels.esp,0x000843~Towels.esp

; ORF_White -- 8 item(s): Towel Body Beige, Towel Body Mint, Towel Body Pink ...
Keyword = ORF_White|Armor|0x000809~Towels.esp,0x00080B~Towels.esp,0x000813~Towels.esp,0x000819~Towels.esp,0x00083F~Towels.esp,0x000841~Towels.esp
Keyword = ORF_White|Armor|0x000849~Towels.esp,0x00084F~Towels.esp

; ORF_Grey -- 2 item(s): Towel Body Pine, Towel Waist Pine
Keyword = ORF_Grey|Armor|0x000817~Towels.esp,0x00084D~Towels.esp

; ORF_Gold -- 2 item(s): Towel Body Orange, Towel Waist Orange
Keyword = ORF_Gold|Armor|0x000815~Towels.esp,0x00084B~Towels.esp

; ORF_Purple -- 2 item(s): Towel Body Burgundy, Towel Waist Burgundy
Keyword = ORF_Purple|Armor|0x000811~Towels.esp,0x000847~Towels.esp
