; ========================================================================
;  Outfit Recognition Framework  --  QwibTravelerOutfit.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 3 item(s): Traveler's Enhanced Hood, Traveler's Hood, Traveler's Hood (lowered)
Keyword = ORF_Hooded|Armor|0x0012D0~QwibTravelerOutfit.esp,0x0083F1~QwibTravelerOutfit.esp,0x0083F2~QwibTravelerOutfit.esp

; ORF_Grey -- 4 item(s): Traveler's Armor, Traveler's Gambeson, Traveler's Outfit ...
Keyword = ORF_Grey|Armor|0x000D63~QwibTravelerOutfit.esp,0x0012C7~QwibTravelerOutfit.esp,0x0012C9~QwibTravelerOutfit.esp,0x003DE6~QwibTravelerOutfit.esp
