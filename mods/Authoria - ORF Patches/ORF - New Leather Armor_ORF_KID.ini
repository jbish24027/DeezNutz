; ========================================================================
;  Outfit Recognition Framework  --  New Leather Armor.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Leather -- 2 item(s): Noble Dark Leather Armor, Noble Leather Armor
Keyword = ORF_Leather|Armor|0x000800~New Leather Armor.esp,0x000810~New Leather Armor.esp

; ORF_Sturdy -- 2 item(s): Noble Dark Leather Armor, Noble Leather Armor
Keyword = ORF_Sturdy|Armor|0x000800~New Leather Armor.esp,0x000810~New Leather Armor.esp

; ORF_Classy -- 2 item(s): Noble Dark Leather Armor, Noble Leather Armor
Keyword = ORF_Classy|Armor|0x000800~New Leather Armor.esp,0x000810~New Leather Armor.esp

; ORF_Black -- 2 item(s): Noble Dark Leather Armor, Noble Leather Armor
Keyword = ORF_Black|Armor|0x000800~New Leather Armor.esp,0x000810~New Leather Armor.esp
