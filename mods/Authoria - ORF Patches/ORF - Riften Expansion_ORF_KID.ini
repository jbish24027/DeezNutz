; ========================================================================
;  Outfit Recognition Framework  --  Riften Expansion.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Sturdy -- 2 item(s): Bearheart Armor, Bearheart Patriarch Armor
Keyword = ORF_Sturdy|Armor|0x3E98AC~Riften Expansion.esp,0x3E98B4~Riften Expansion.esp

; ORF_Classy -- 3 item(s): Fine Doublet, Fine Outlander Clothes
Keyword = ORF_Classy|Armor|0x20D7A8~Riften Expansion.esp,0x20D7AC~Riften Expansion.esp,0x20D7C4~Riften Expansion.esp

; ORF_Red -- 2 item(s): Fine Outlander Clothes, Tailor's Vest
Keyword = ORF_Red|Armor|0x20D7A8~Riften Expansion.esp,0x20D7AE~Riften Expansion.esp

; ORF_Black -- 1 item(s): Bearheart Patriarch Armor
Keyword = ORF_Black|Armor|0x3E98B4~Riften Expansion.esp

; ORF_Brown -- 2 item(s): Fine Doublet
Keyword = ORF_Brown|Armor|0x20D7AC~Riften Expansion.esp,0x20D7C4~Riften Expansion.esp

; ORF_Grey -- 1 item(s): Bearheart Armor
Keyword = ORF_Grey|Armor|0x3E98AC~Riften Expansion.esp
