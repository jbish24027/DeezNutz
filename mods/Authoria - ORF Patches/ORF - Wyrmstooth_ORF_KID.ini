; ========================================================================
;  Outfit Recognition Framework  --  Wyrmstooth.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 2 item(s): Greybeard's Hood, Stoneman's Hood
Keyword = ORF_Hooded|Armor|0x4F97AC~Wyrmstooth.esp,0x6238D6~Wyrmstooth.esp

; ORF_Sturdy -- 3 item(s): Athir's Armor, Daenlit's Armor, Elmera's Armor
Keyword = ORF_Sturdy|Armor|0x17E919~Wyrmstooth.esp,0x17E91C~Wyrmstooth.esp,0x17E922~Wyrmstooth.esp

; ORF_Brown -- 3 item(s): Athir's Armor, Daenlit's Armor, Lurius' Clothes
Keyword = ORF_Brown|Armor|0x17E919~Wyrmstooth.esp,0x17E91C~Wyrmstooth.esp,0x17E925~Wyrmstooth.esp

; ORF_Grey -- 2 item(s): Elmera's Armor, Lorumend's Clothes
Keyword = ORF_Grey|Armor|0x17E922~Wyrmstooth.esp,0x180CE8~Wyrmstooth.esp
