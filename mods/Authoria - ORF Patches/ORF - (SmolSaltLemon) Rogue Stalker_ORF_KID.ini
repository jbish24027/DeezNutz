; ========================================================================
;  Outfit Recognition Framework  --  (SmolSaltLemon) Rogue Stalker.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_ShortSkirt -- 2 item(s): Rogue Stalker - Skirt, Rogue Stalker - Skirt (cloth)
Keyword = ORF_ShortSkirt|Armor|0x000809~(SmolSaltLemon) Rogue Stalker.esp,0x000810~(SmolSaltLemon) Rogue Stalker.esp

; ORF_Sturdy -- 2 item(s): Rogue Stalker - Cuirass, Rogue Stalker - Cuirass (cloth)
Keyword = ORF_Sturdy|Armor|0x00080C~(SmolSaltLemon) Rogue Stalker.esp,0x000D62~(SmolSaltLemon) Rogue Stalker.esp

; ORF_Black -- 2 item(s): Rogue Stalker - Cuirass, Rogue Stalker - Cuirass (cloth)
Keyword = ORF_Black|Armor|0x00080C~(SmolSaltLemon) Rogue Stalker.esp,0x000D62~(SmolSaltLemon) Rogue Stalker.esp
