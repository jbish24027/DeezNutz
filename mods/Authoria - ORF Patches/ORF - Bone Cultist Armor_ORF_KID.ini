; ========================================================================
;  Outfit Recognition Framework  --  Bone Cultist Armor.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 2 item(s): Bone Cultist Hood, Bone Cultist Hood II
Keyword = ORF_Hooded|Armor|0x000815~Bone Cultist Armor.esp,0x000816~Bone Cultist Armor.esp

; ORF_Sturdy -- 2 item(s): Bone Cultist Armor, Bone Cultist Pauldron Armor
Keyword = ORF_Sturdy|Armor|0x000807~Bone Cultist Armor.esp,0x000808~Bone Cultist Armor.esp

; ORF_Intimidating -- 2 item(s): Bone Cultist Armor, Bone Cultist Pauldron Armor
Keyword = ORF_Intimidating|Armor|0x000807~Bone Cultist Armor.esp,0x000808~Bone Cultist Armor.esp

; ORF_Yellow -- 2 item(s): Bone Cultist Armor, Bone Cultist Pauldron Armor
Keyword = ORF_Yellow|Armor|0x000807~Bone Cultist Armor.esp,0x000808~Bone Cultist Armor.esp
