; ========================================================================
;  Outfit Recognition Framework  --  kco_stw.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Classy -- 6 item(s): Steward's Regalia, Steward's Regalia of Markarth, Steward's Regalia of Riften ...
Keyword = ORF_Classy|Armor|0x000802~kco_stw.esp,0x00080D~kco_stw.esp,0x00080E~kco_stw.esp,0x00080F~kco_stw.esp,0x000810~kco_stw.esp,0x00083C~kco_stw.esp

; ORF_Black -- 6 item(s): Steward's Regalia, Steward's Regalia of Markarth, Steward's Regalia of Riften ...
Keyword = ORF_Black|Armor|0x000802~kco_stw.esp,0x00080D~kco_stw.esp,0x00080E~kco_stw.esp,0x00080F~kco_stw.esp,0x000810~kco_stw.esp,0x00083C~kco_stw.esp
