; ========================================================================
;  Outfit Recognition Framework  --  NibeneanArmorsAndOutfit.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Hooded -- 1 item(s): Nibenean Hooded Fur Cape
Keyword = ORF_Hooded|Armor|0x00081E~NibeneanArmorsAndOutfit.esp

; ORF_Leather -- 6 item(s): Nibenean Dark Steel Cuirass, Nibenean Dark Steel Cuirass No Pau, Nibenean Leather Cuirass ...
Keyword = ORF_Leather|Armor|0x000804~NibeneanArmorsAndOutfit.esp,0x000814~NibeneanArmorsAndOutfit.esp,0x00082F~NibeneanArmorsAndOutfit.esp,0x000830~NibeneanArmorsAndOutfit.esp,0x000833~NibeneanArmorsAndOutfit.esp,0x000847~NibeneanArmorsAndOutfit.esp

; ORF_Sturdy -- 4 item(s): Nibenean Dark Steel Cuirass, Nibenean Dark Steel Cuirass No Pau, Nibenean Leather Cuirass ...
