; ORF_Brown -- 6 item(s): Nibenean Dark Steel Cuirass, Nibenean Dark Steel Cuirass No Pau, Nibenean Leather Cuirass ...
Keyword = ORF_Brown|Armor|0x000804~NibeneanArmorsAndOutfit.esp,0x000814~NibeneanArmorsAndOutfit.esp,0x00082F~NibeneanArmorsAndOutfit.esp,0x000830~NibeneanArmorsAndOutfit.esp,0x000833~NibeneanArmorsAndOutfit.esp,0x000847~NibeneanArmorsAndOutfit.esp
