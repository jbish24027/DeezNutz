; ========================================================================
;  Outfit Recognition Framework  --  BIMDOArmorVersion.esp
;  Authored for the Authoria load order, 2026-08-19.
;
;  Colour and character keywords are on slot-32 outer garments ONLY.
;  ORF tests WornHasKeyword, which pools every worn piece, so colour on
;  boots or a helmet would make the whole outfit read as that colour.
;  Shape and coverage keywords go on whichever piece actually is that
;  thing, on any slot.
;
;  Colours were read off the texture this load order actually loads,
;  which is often a retexture rather than the mod author's own.
;  FormID addressing survives Reqtificator EditorID renames.
; ========================================================================

; ORF_Red -- 1 item(s): Mage's Daily Outfit-Burgundy
Keyword = ORF_Red|Armor|0x000D7C~BIMDOArmorVersion.esp

; ORF_Blue -- 1 item(s): Mage's Daily Outfit-College Blue
Keyword = ORF_Blue|Armor|0x000D7D~BIMDOArmorVersion.esp

; ORF_Green -- 2 item(s): Mage's Daily Outfit- Serano Teal, Mage's Daily Outfit-Forest Green
Keyword = ORF_Green|Armor|0x000D7F~BIMDOArmorVersion.esp,0x000D80~BIMDOArmorVersion.esp

; ORF_Yellow -- 1 item(s): Mage's Daily Outfit-Dijon
Keyword = ORF_Yellow|Armor|0x000D7E~BIMDOArmorVersion.esp

; ORF_Purple -- 1 item(s): Mage's Daily Outfit-Athena
Keyword = ORF_Purple|Armor|0x000D7B~BIMDOArmorVersion.esp
